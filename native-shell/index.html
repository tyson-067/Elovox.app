<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Elovox</title>
<!--
  The offline shell.

  Capacitor requires a `webDir` even when `server.url` points the app at
  https://elovox.app, and this is what it holds. It is the ONLY thing a user
  sees when the network is gone or the site is down, so it must render with
  zero requests: no fonts, no CDN, no external CSS. The one local asset is
  logo.png, copied from public/ and bundled into the app.

  Colours are copied literally from app/globals.css rather than imported,
  because there is no build step here — keep them in sync by hand if the
  brand palette moves.
-->
<style>
  :root {
    --surface: #f4f7fc;
    --surface-warm: #fdf6ee;
    --amande: #f9dfc6;
    --primary: #004e89;   /* Lapis */
    --accent: #ff6b35;    /* Bright Orange */
    --on-surface: #0b0829;        /* Bleu Oxford */
    --on-surface-variant: #4a5068;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    /* System font stack: on iOS this resolves to SF, which is already on the
       device. next/font's self-hosted faces are not available here. */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--on-surface);
    background: linear-gradient(
      170deg,
      var(--surface) 38%,
      var(--surface-warm) 72%,
      var(--amande) 100%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    /* Clear the notch and the home indicator. */
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    text-align: center;
    max-width: 22rem;
  }

  img {
    width: 88px;
    height: 88px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 1.375rem;
    line-height: 1.3;
    font-weight: 650;
    color: var(--primary);
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  p {
    font-size: 0.95rem;
    line-height: 1.55;
    color: var(--on-surface-variant);
    margin: 0 0 28px;
  }

  button {
    font: inherit;
    font-weight: 600;
    font-size: 1rem;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    padding: 14px 40px;
    cursor: pointer;
    /* iOS needs this or the button renders as a grey system control. */
    -webkit-appearance: none;
    appearance: none;
    transition: transform 120ms ease, opacity 120ms ease;
  }

  button:active { transform: scale(0.97); opacity: 0.9; }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active { transform: none; }
  }

  /* The app's dark mode is a saved choice on the elovox.app origin, which
     this page cannot read — it is served from the bundle. So it follows the
     phone instead. Getting this wrong is glaring: the one time this screen
     appears is a cold launch with no network, and a white flash at night is
     what the whole dark theme exists to avoid. */
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #7fb2e5;
      --on-surface: #eceaf6;
      --on-surface-variant: #a8a6bd;
    }
    body {
      background: linear-gradient(170deg, #0d0a20 40%, #141033 100%);
    }
  }
</style>
</head>
<body>
  <main>
    <img src="logo.png" alt="" />
    <h1>No connection</h1>
    <p>Elovox needs to be online to run your rep and score it. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // The splash is normally taken down by components/NativeRuntime.tsx once
    // the real app has painted — code that lives on elovox.app, the one
    // origin that is unreachable when this page is the one being shown. The
    // native 3s backstop would clear it eventually; calling hide() here just
    // spares the no-signal user three seconds of staring at artwork before
    // "No connection / Try again" appears.
    //
    // Called straight through the bridge rather than the plugin's JS wrapper,
    // which would need a bundler this page deliberately does not have. The
    // bridge is injected before body scripts, but retried once on load in
    // case this ever renders before it is ready.
    (function () {
      function hideSplash() {
        try {
          window.Capacitor.Plugins.SplashScreen.hide();
        } catch (e) {
          /* Not native, or no splash up. Either way there is nothing to do. */
        }
      }
      hideSplash();
      window.addEventListener('load', hideSplash);
    })();
  </script>
</body>
</html>
