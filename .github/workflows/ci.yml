name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run irrelevant. Cancelling keeps the queue
  # honest and stops a stale red X sitting on a commit that was already fixed.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job builds without secrets. Nothing here needs Firebase, Stripe or
  # Gemini: the app is designed to run with none of them (lib/firebase.ts falls
  # back to localStorage), and a CI pipeline that needs production credentials
  # is a pipeline that cannot run on a fork's pull request.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  e2e:
    name: Browser gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Cache the browser binary, not just node_modules — it is ~95MB and
      # downloading it on every run is most of this job's wall clock.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[^0-9.]/g,'')")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts owns the server: it builds with Firebase blanked
      # so the signed-in surface renders through the localStorage fallback,
      # then serves the PRODUCTION build. Dev-mode CSS is ordered differently
      # and at least one bug here only appeared once Tailwind had tree-shaken.
      - name: Run the gates
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
